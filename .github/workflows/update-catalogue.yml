name: Update Label AKS Product Catalogue

on:
  push:
    paths:
      - 'images/**'
      - 'scripts/build_catalogue.py'
      - '.github/workflows/update-catalogue.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-catalogue:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Generate products.json
        run: python scripts/build_catalogue.py

      - name: Save updated catalogue
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add products.json
          git diff --cached --quiet || git commit -m "Automatically update product catalogue"
          git push
